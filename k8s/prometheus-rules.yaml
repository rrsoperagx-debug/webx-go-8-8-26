apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: webx-go-slo
spec:
  groups:
  - name: webx.slo
    rules:
    - alert: HighLatency
      expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.01
      for: 5m
      labels: {severity: page}
      annotations: {summary: "p99 >10ms Go"}
    - alert: HighInFlight
      expr: http_in_flight_requests > 450
      for: 1m
      labels: {severity: warning}
